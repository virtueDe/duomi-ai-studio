name: Duomi AI Studio 发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/virtuede/duomi-ai-studio
  VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '' }}
  VITE_SUB2API_BASE_URL: ${{ vars.VITE_SUB2API_BASE_URL || '' }}
  VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/duomi-studio/' }}
  VITE_PROVIDER_DEFAULT_BASE_URL: ${{ vars.VITE_PROVIDER_DEFAULT_BASE_URL || 'https://api.chatfire.site/v1' }}

jobs:
  docker:
    name: 构建并推送 Duomi 镜像
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.release_image.outputs.image }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取 package.json 版本
        id: version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: 校验版本标签
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version" || { echo "Git tag ${tag_version} 与 package.json ${package_version} 不一致" >&2; exit 1; }

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: 记录正式发布镜像
        id: release_image
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "image=${IMAGE_NAME}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_SUB2API_BASE_URL=${{ env.VITE_SUB2API_BASE_URL }}
            VITE_BASE_PATH=${{ env.VITE_BASE_PATH }}
            VITE_PROVIDER_DEFAULT_BASE_URL=${{ env.VITE_PROVIDER_DEFAULT_BASE_URL }}

  deploy:
    name: 部署 Duomi 到服务器
    needs: docker
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ secrets.DUOMI_DEPLOY_DIR || '/opt/proxy/duomi-studio' }}
      DEPLOY_COMPOSE_FILE: ${{ secrets.DUOMI_DEPLOY_COMPOSE_FILE || 'docker-compose.duomi.yml' }}
      GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
      GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      RELEASE_IMAGE: ${{ needs.docker.outputs.image }}
    steps:
      - name: 检出部署文件
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/docker-compose.duomi.yml
            deploy/remote-deploy.sh
          sparse-checkout-cone-mode: false

      - name: 校验部署配置
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "缺少 DEPLOY_HOST" >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "缺少 DEPLOY_USER" >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "缺少 DEPLOY_SSH_KEY" >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "缺少 DEPLOY_KNOWN_HOSTS" >&2; exit 1; }
          test -n "$RELEASE_IMAGE" || { echo "正式发布镜像为空" >&2; exit 1; }

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 写入可信主机指纹
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: 登录服务器 GHCR
        if: ${{ env.GHCR_DEPLOY_TOKEN != '' }}
        shell: bash
        run: |
          remote_login_cmd="docker login ghcr.io --username $(printf '%q' "$GHCR_DEPLOY_USERNAME") --password-stdin"
          printf '%s' "$GHCR_DEPLOY_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_login_cmd"

      - name: 上传 Compose 文件
        shell: bash
        run: |
          remote_dir=$(printf '%q' "$DEPLOY_DIR")
          remote_compose=$(printf '%q' "$DEPLOY_DIR/$DEPLOY_COMPOSE_FILE")
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p -- ${remote_dir} && cat > ${remote_compose}" < deploy/docker-compose.duomi.yml

      - name: 部署正式镜像
        shell: bash
        run: |
          remote_args=$(printf '%q ' "$DEPLOY_DIR" "$DEPLOY_COMPOSE_FILE" "$RELEASE_IMAGE")
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- ${remote_args}" < deploy/remote-deploy.sh
