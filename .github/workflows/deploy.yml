name: Duomi AI Studio 手动部署

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR 镜像 tag，例如 0.1.0 或 latest'
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: 部署指定 Duomi 镜像
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ secrets.DUOMI_DEPLOY_DIR || '/opt/proxy/duomi-studio' }}
      DEPLOY_COMPOSE_FILE: ${{ secrets.DUOMI_DEPLOY_COMPOSE_FILE || 'docker-compose.duomi.yml' }}
      GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
      GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      RELEASE_IMAGE: ghcr.io/virtuede/duomi-ai-studio:${{ inputs.image_tag }}
    steps:
      - name: 检出部署文件
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/docker-compose.duomi.yml
            deploy/remote-deploy.sh
          sparse-checkout-cone-mode: false

      - name: 校验部署配置
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "缺少 DEPLOY_HOST" >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "缺少 DEPLOY_USER" >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "缺少 DEPLOY_SSH_KEY" >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "缺少 DEPLOY_KNOWN_HOSTS" >&2; exit 1; }

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 写入可信主机指纹
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: 登录服务器 GHCR
        if: ${{ env.GHCR_DEPLOY_TOKEN != '' }}
        shell: bash
        run: |
          remote_login_cmd="docker login ghcr.io --username $(printf '%q' "$GHCR_DEPLOY_USERNAME") --password-stdin"
          printf '%s' "$GHCR_DEPLOY_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_login_cmd"

      - name: 上传 Compose 文件
        shell: bash
        run: |
          remote_dir=$(printf '%q' "$DEPLOY_DIR")
          remote_compose=$(printf '%q' "$DEPLOY_DIR/$DEPLOY_COMPOSE_FILE")
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p -- ${remote_dir} && cat > ${remote_compose}" < deploy/docker-compose.duomi.yml

      - name: 部署指定镜像
        shell: bash
        run: |
          remote_args=$(printf '%q ' "$DEPLOY_DIR" "$DEPLOY_COMPOSE_FILE" "$RELEASE_IMAGE")
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- ${remote_args}" < deploy/remote-deploy.sh
